
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- SIGNUP -->
    <section id="signupPage" class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join your personal space</p>

        <form id="signupForm">
            <input id="signupUsername" type="text"
                   placeholder="Username" minlength="3"
                   maxlength="30" required>

            <input id="signupEmail" type="email"
                   placeholder="Email address" required>

            <input id="signupPassword" type="password"
                   placeholder="Password" minlength="6" required>

            <input id="confirmPassword" type="password"
                   placeholder="Confirm password" required>

            <button type="submit">Sign Up</button>
        </form>

        <p id="signupMessage" class="message"></p>

        <p class="switch">
            Already registered?
            <a href="#" id="showLogin">Login</a>
        </p>
    </section>


    <!-- LOGIN -->
    <section id="loginPage" class="auth-card hidden">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your personal space</p>

        <form id="loginForm">
            <input id="loginEmail" type="email"
                   placeholder="Email address" required>

            <input id="loginPassword" type="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p id="loginMessage" class="message"></p>

        <a href="#" id="forgotPassword">Forgot Password?</a>

        <p class="switch">
            New user?
            <a href="#" id="showSignup">Sign Up</a>
        </p>
    </section>


    <!-- DASHBOARD -->
    <section id="dashboardPage" class="dashboard hidden">

        <header class="dashboard-header">
            <div>
                <h1>My Personal Space</h1>
                <p>Welcome, <strong id="displayUsername"></strong>!</p>
            </div>

            <button id="logoutButton" class="logout">
                Logout
            </button>
        </header>

        <div class="welcome-card">
            <h2>Your personal dashboard</h2>
            <p>You are successfully logged in!</p>
        </div>

        <div class="notes-card">
            <h2>My Personal Notes</h2>

            <textarea id="noteInput"
                placeholder="Write your personal notes..."></textarea>

            <button id="saveNote">Save Note</button>

            <p id="noteMessage" class="message"></p>

            <h3>Saved Notes</h3>
            <div id="notesList"></div>
        </div>

    </section>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
